limit_req_zone $binary_remote_addr zone=motion_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=motion_connections:10m;
server {
    listen 443 ssl;
    server_name 39.107.192.82;
    ssl_certificate /etc/letsencrypt/live/shi-survey/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shi-survey/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 300m;
    client_body_timeout 120s;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    access_log off;
    location / {
        limit_req zone=motion_api burst=30 nodelay;
        limit_conn motion_connections 8;
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
