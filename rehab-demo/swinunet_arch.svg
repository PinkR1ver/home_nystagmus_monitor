<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" style="max-width:100%;height:auto;display:block;margin:0 auto">
  <defs>
    <marker id="a" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><path d="M0,0 L6,2 L0,4 Z" fill="#8a837c"/></marker>
    <marker id="ag" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><path d="M0,0 L6,2 L0,4 Z" fill="#4a7c62"/></marker>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fdfcfa"/><stop offset="100%" stop-color="#e6f0ea"/></linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" fill="#f7f5f2" rx="6"/>

  <!-- Title -->
  <text x="360" y="22" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="13" font-weight="600" fill="#2c2826">SwinUNet Architecture for Gaze Estimation</text>

  <!-- === ENCODER (left) === -->
  <!-- Input -->
  <rect x="40" y="40" width="100" height="50" rx="3" fill="#fdfcfa" stroke="#d5cfc8" stroke-width="1"/>
  <text x="90" y="60" text-anchor="middle" font-family="monospace" font-size="9" fill="#5e5852">36 × 60 × 3</text>
  <text x="90" y="76" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="8" fill="#8a837c">Eye ROI</text>

  <!-- Patch Embed -->
  <rect x="40" y="105" width="100" height="50" rx="3" fill="#fdfcfa" stroke="#d5cfc8" stroke-width="1"/>
  <text x="90" y="125" text-anchor="middle" font-family="monospace" font-size="9" fill="#5e5852">18 × 30 × 96</text>
  <text x="90" y="141" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="8" fill="#8a837c">Patch Embed (stride 2)</text>

  <!-- Stage 1 -->
  <rect x="40" y="170" width="100" height="66" rx="3" fill="#fdfcfa" stroke="#d5cfc8" stroke-width="1"/>
  <text x="90" y="190" text-anchor="middle" font-family="monospace" font-size="9" fill="#5e5852">18 × 30 × 96</text>
  <text x="90" y="208" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="8" fill="#5e5852">SwinBlock ×2</text>
  <text x="90" y="224" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#8a837c">heads=3 · window=7</text>

  <!-- Down 1 -->
  <rect x="40" y="250" width="100" height="50" rx="3" fill="#fdfcfa" stroke="#d5cfc8" stroke-width="1"/>
  <text x="90" y="270" text-anchor="middle" font-family="monospace" font-size="9" fill="#5e5852">9 × 15 × 192</text>
  <text x="90" y="286" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="8" fill="#8a837c">Patch Merging ↓</text>

  <!-- Stage 2 -->
  <rect x="40" y="315" width="100" height="66" rx="3" fill="#fdfcfa" stroke="#d5cfc8" stroke-width="1"/>
  <text x="90" y="335" text-anchor="middle" font-family="monospace" font-size="9" fill="#5e5852">9 × 15 × 192</text>
  <text x="90" y="353" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="8" fill="#5e5852">SwinBlock ×2</text>
  <text x="90" y="369" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#8a837c">heads=6 · window=7</text>

  <!-- Arrows down left -->
  <line x1="90" y1="90" x2="90" y2="103" stroke="#8a837c" stroke-width="1" marker-end="url(#a)"/>
  <line x1="90" y1="155" x2="90" y2="168" stroke="#8a837c" stroke-width="1" marker-end="url(#a)"/>
  <line x1="90" y1="236" x2="90" y2="248" stroke="#8a837c" stroke-width="1" marker-end="url(#a)"/>
  <line x1="90" y1="300" x2="90" y2="313" stroke="#8a837c" stroke-width="1" marker-end="url(#a)"/>

  <!-- === BOTTLENECK === -->
  <rect x="290" y="315" width="140" height="66" rx="4" fill="url(#gb)" stroke="#4a7c62" stroke-width="1.5"/>
  <text x="360" y="338" text-anchor="middle" font-family="monospace" font-size="9" fill="#2c2826">9 × 15 × 384</text>
  <text x="360" y="356" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="8.5" font-weight="600" fill="#4a7c62">Bottleneck</text>
  <text x="360" y="372" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#8a837c">heads=12 · window=7</text>

  <!-- Stage3 Down arrow -->
  <line x1="90" y1="348" x2="288" y2="348" stroke="#8a837c" stroke-width="1" marker-end="url(#a)"/>
  <text x="195" y="342" text-anchor="middle" font-family="monospace" font-size="7" fill="#8a837c">↓ Patch Merging 192→384</text>

  <!-- === DECODER (right) === -->
  <!-- Stage 2 up -->
  <rect x="480" y="250" width="130" height="66" rx="3" fill="#fdfcfa" stroke="#d5cfc8" stroke-width="1"/>
  <text x="545" y="270" text-anchor="middle" font-family="monospace" font-size="9" fill="#5e5852">9 × 15 × 192</text>
  <text x="545" y="288" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="8" fill="#5e5852">SwinBlock + Up</text>
  <text x="545" y="306" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#8a837c">heads=6 · stride 2 ↑</text>

  <!-- Stage 1 up -->
  <rect x="480" y="170" width="130" height="66" rx="3" fill="#fdfcfa" stroke="#d5cfc8" stroke-width="1"/>
  <text x="545" y="190" text-anchor="middle" font-family="monospace" font-size="9" fill="#5e5852">18 × 30 × 96</text>
  <text x="545" y="208" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="8" fill="#5e5852">SwinBlock + Up</text>
  <text x="545" y="226" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#8a837c">heads=3 · stride 2 ↑</text>

  <!-- Final up -->
  <rect x="480" y="105" width="130" height="50" rx="3" fill="#fdfcfa" stroke="#d5cfc8" stroke-width="1"/>
  <text x="545" y="125" text-anchor="middle" font-family="monospace" font-size="9" fill="#5e5852">36 × 60 × 96</text>
  <text x="545" y="140" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="8" fill="#8a837c">Final Up (stride 2)</text>

  <!-- Regression Head -->
  <rect x="480" y="40" width="130" height="50" rx="4" fill="#e6f0ea" stroke="#4a7c62" stroke-width="1.3"/>
  <text x="545" y="58" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="9" font-weight="600" fill="#2c2826">Regression Head</text>
  <text x="545" y="76" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a7c62">GAP → 256 → 128 → 3</text>

  <!-- Output -->
  <rect x="620" y="40" width="70" height="50" rx="3" fill="#e6f0ea" stroke="#4a7c62" stroke-width="1"/>
  <text x="655" y="62" text-anchor="middle" font-family="monospace" font-size="9" font-weight="600" fill="#4a7c62">(x, y, z)</text>
  <text x="655" y="78" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="7.5" fill="#8a837c">3D Gaze</text>

  <!-- Right side arrows -->
  <line x1="545" y1="310" x2="545" y2="296" stroke="#8a837c" stroke-width="1" marker-end="url(#a)"/>
  <line x1="545" y1="236" x2="545" y2="222" stroke="#8a837c" stroke-width="1" marker-end="url(#a)"/>
  <line x1="545" y1="155" x2="545" y2="141" stroke="#8a837c" stroke-width="1" marker-end="url(#a)"/>
  <line x1="545" y1="90" x2="545" y2="78" stroke="#8a837c" stroke-width="1" marker-end="url(#a)"/>

  <!-- Bottleneck → Decoder arrow -->
  <line x1="430" y1="348" x2="478" y2="283" stroke="#4a7c62" stroke-width="1" marker-end="url(#ag)"/>

  <!-- Skip connections (dashed) -->
  <line x1="140" y1="203" x2="478" y2="203" stroke="#8a837c" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="140" y1="348" x2="478" y2="283" stroke="#8a837c" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Skip labels -->
  <text x="320" y="197" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="7" fill="#8a837c" opacity="0.7">skip connection</text>
  <text x="320" y="340" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="7" fill="#8a837c" opacity="0.7">skip connection</text>

  <!-- Reg head → output arrow -->
  <line x1="610" y1="65" x2="618" y2="65" stroke="#4a7c62" stroke-width="1" marker-end="url(#ag)"/>
</svg>